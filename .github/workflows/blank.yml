name: Professional-DevOps-Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Source Stage (GitHub)
      uses: actions/checkout@v4

    - name: 2. Build Stage (Environment Setup)
      run: |
        echo "Setting up Python environment..."
        python -m pip install --upgrade pip
        pip install pytest

    - name: 3. Test Stage (Automated Testing)
      run: |
        echo "Running Unit Tests as per slide 33..."
        pytest test_app.py

    - name: 4. Deploy Stage (AWS / Azure Simulation)
      run: |
        echo "Connecting to AWS CodePipeline..."
        echo "Uploading artifacts to Amazon S3 Bucket..."
        echo "Triggering Azure App Service Deployment..."
        echo "DONE: Application is now LIVE on the Cloud!"
