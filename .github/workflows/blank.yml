name: Professional-DevOps-Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

   steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python_version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest  # تأكد من تنصيب pytest أيضاً

      - name: Run Tests
        run: |
          echo "Running Unit Tests as per slide 33..."
          pytest test_app.py