name: My DevOps Pipeline

on:
  push:
    [cite_start]branches: [ "main" ] # سيعمل الكود تلقائياً عند كل Commit [cite: 34, 35]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - [cite_start]uses: actions/checkout@v4 # سحب الكود (Source) [cite: 29]

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # هنا يتم تجهيز البرنامج (Build) [cite: 31]

    - name: Run Automated Tests
      run: |
        # هنا نقوم بتشغيل الاختبارات الآلية (Testing) [cite: 33, 41]
        echo "Running Unit Tests..."
        # سنفترض نجاح الاختبار لغرض التجربة
