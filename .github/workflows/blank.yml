name: CI-CD-Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Source Stage - Checkout Code
      uses: actions/checkout@v4

    - name: Build Stage - Set up environment
      run: |
        echo "Compiling code into executable artifacts..."
        echo "Managing dependencies for release."

    - name: Test Stage - Automated Testing
      run: |
        echo "Executing unit tests to validate code quality..."
        echo "Checking functionality and performance."

    - name: Deploy Stage - Release
      run: |
        echo "Deployment successful! Faster and more reliable release achieved."
