name: CI-CD-Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Source Stage - Checkout Code
      uses: actions/checkout@v4

    - name: Build Stage - Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Test Stage - Run Automated Tests
     # هذا السطر ينفذ الاختبارات الآلية التي ذكرتها في السلايد 33
      run: pytest test_app.py

    - name: Deploy Stage - Release
      run: echo "Deployment successful! High-quality software delivered faster."
