name: CI-CD-Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

   steps:
    - name: Checkout Code
      [cite_start]uses: actions/checkout@v4 [cite: 34, 35]

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Pytest
      run: pip install pytest

    - name: Run Automated Unit Tests
      [cite_start]run: pytest test_app.py [cite: 33, 41]
